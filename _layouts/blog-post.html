---
layout: blog
---
<article class="blog-article">
{% if page.youtube_id %}
<div class="blog-article__video">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ page.youtube_id | escape }}" title="{{ page.title | escape }} — video" width="856" height="482" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
</div>
{% endif %}
<header class="blog-article__header">
<h1>{{ page.title | escape }}</h1>
</header>
<div class="blog-article__body">{{ content }}</div>
<footer class="blog-article__byline">
  <a href="{{ '/stories-in-animation/' | relative_url }}">{{ page.author | escape }}</a>
  <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
</footer>
</article>
<nav class="blog-article__navigation" aria-label="More stories">
{% if page.next %}<a class="blog-story-previous" href="{{ page.next.url | relative_url }}"><strong>← {{ page.next.title }}</strong></a>{% endif %}
{% if page.previous %}<a class="blog-story-next" href="{{ page.previous.url | relative_url }}"><strong>{{ page.previous.title }} →</strong></a>{% endif %}
</nav>
