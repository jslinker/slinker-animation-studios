---
layout: blog
---
<article class="blog-article">
<header class="blog-article__header">
<p class="blog-article__meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d" }}</time><span aria-hidden="true">•</span><span>Written By <a href="{{ '/stories-in-animation/' | relative_url }}">{{ page.author }}</a></span></p>
<h1>{{ page.title }}</h1>
</header>
<div class="blog-article__body">{{ content }}</div>
<p class="blog-article__author"><a href="{{ '/stories-in-animation/' | relative_url }}">{{ page.author }}</a></p>
</article>
<nav class="blog-article__navigation" aria-label="More stories">
{% if page.next %}<a class="blog-story-previous" href="{{ page.next.url | relative_url }}"><span>Previous</span><strong>← {{ page.next.title }}</strong></a>{% endif %}
{% if page.previous %}<a class="blog-story-next" href="{{ page.previous.url | relative_url }}"><span>Next</span><strong>{{ page.previous.title }} →</strong></a>{% endif %}
</nav>
