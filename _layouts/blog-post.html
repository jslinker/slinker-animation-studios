---
layout: blog
---
<article class="blog-article">
<header class="blog-article__header">
<a href="{{ '/stories-in-animation/' | relative_url }}">Stories in Animation</a>
<h1>{{ page.title }}</h1>
<p><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time> · {{ page.author }}</p>
</header>
<div class="blog-article__body">{{ content }}</div>
<nav class="blog-article__navigation" aria-label="More stories">
{% if page.previous %}<a href="{{ page.previous.url | relative_url }}">← {{ page.previous.title }}</a>{% endif %}
{% if page.next %}<a href="{{ page.next.url | relative_url }}">{{ page.next.title }} →</a>{% endif %}
</nav>
</article>
